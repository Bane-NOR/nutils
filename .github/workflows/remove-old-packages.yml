name: Delete Old Packages
on:
  workflow_dispatch:
  push:
    branches: ["feat/delete-old-packages"]

permissions:
  packages: write

jobs:
  find-and-delete-old-packages:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Generate GitHub App token
          id: generate-token
          uses: actions/create-github-app-token@v1
          with:
            app-id: ${{ vars.GH_MGMT_APP_ID }}
            private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
            owner: ${{ github.repository_owner }}

        - name: Declare repository name
          id: declare-repo
          run: | 
            FULL_REPO_NAME="${{ github.repository }}"
            ORG_NAME="${{ github.repository_owner }}"
            REPO_NAME=${FULL_REPO_NAME#"$ORG_NAME/"}
            echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
            
        - name: Find old packages
          id: old-packages
          env:
            GH_TOKEN: ${{ steps.generate-token.outputs.token }}
            REPO_NAME: ${{ env.REPO_NAME }}
          run: |
            DATE_90_DAYS_AGO=$(date -d '-90 days' '+%Y-%m-%dT%H:%M:%SZ')
            PACKAGE_IDS=$(curl -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/orgs/Bane-NOR/packages/container/${{ env.REPO_NAME }}/versions \
            | jq -r ".[] | select(.created_at < \"$DATE_90_DAYS_AGO\") | .id" | xargs)
            echo "PACKAGE_IDS=${PACKAGE_IDS}" >> $GITHUB_ENV

        - name: Delete old packages
          if: env.PACKAGE_IDS != ''
          env:
            GH_TOKEN: ${{ steps.generate-token.outputs.token }}
            REPO_NAME: ${{ env.REPO_NAME }}
          run: |
            for PACKAGE_ID in $PACKAGE_IDS; do
              echo "Deleting package with ID: $PACKAGE_ID"
              curl -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/orgs/Bane-NOR/packages/container/${{ env.REPO_NAME }}/versions/$PACKAGE_ID
            done
        
        - name: Test delete one package
          env:
            GH_TOKEN: ${{ steps.generate-token.outputs.token }}
            REPO_NAME: ${{ env.REPO_NAME }}
          run: |
            curl -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/orgs/Bane-NOR/packages/container/${{ env.REPO_NAME }}@sha256:cead181a4760aa49bb6f0b8f5347d8a65dfb63accaa597d7ba8302253a2f0dc7/versions/355529200